apiVersion: apps/v1
kind: Deployment
metadata:
  name: plenartrend-static-data-and-migrator
  namespace: plenartrend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plenartrend-static-data-and-migrator
  template:
    metadata:
      labels:
        app: plenartrend-static-data-and-migrator
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - plenartrend-static-data-and-migrator
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
      - name: docker-registry-secret
      containers:
      - name: static-data-and-migrator
        image: registry.sokutan.de/plenartrend/static-data-and-migrator:002d0c4bd4df8a0ec5777611e141de937bb145bc
        imagePullPolicy: IfNotPresent
        env:
          - name: DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: postgres-admin-secret
                key: username
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-admin-secret
                key: password
          - name: DATABASE_HOST
            value: "postgresql-db-rw.plenartrend.svc.cluster.local"
          - name: DATABASE_PORT
            value: "5432"
          - name: DATABASE_NAME
            value: "plenartrenddb"
          - name: DIP_API_Key
            value: "OSOegLs.PR2lwJ1dwCeje9vTj7FPOt3hvpYKtwKkhw"
          - name: BEGIN_INGESTION_ON_STARTUP
            value: "true"
          - name: INGESTION_INTERVAL_MINUTES
            value: "60"
          - name: LOG_LEVEL
            value: "info"
        ports:
          - containerPort: 8080
            name: http
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

