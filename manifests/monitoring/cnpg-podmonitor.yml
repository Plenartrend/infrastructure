apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-podmonitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cloudnative-pg
    cnpg.io/cluster: postgresql-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgresql-db
  
  namespaceSelector:
    matchNames:
      - plenartrend
  
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

